<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>お菓子を食べ続けないと死ぬゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1236;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠（縦9:16で中央）。単位は cqw（枠の幅の1%）。触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}

/* タイトル */
#title{position:absolute;left:5cqw;right:5cqw;top:44cqw;z-index:20;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3cqw}
#title.hide{display:none}
#title .t1{font-size:4.6cqw;font-weight:bold;color:#2a1650;background:#ffb347;border-radius:5cqw;padding:.8cqw 4.5cqw;letter-spacing:.4cqw;box-shadow:0 .8cqw 0 #b86d12}
#title .t2{font-size:10.5cqw;font-weight:900;line-height:1.15;color:#ffb347;
  -webkit-text-stroke:1.4cqw #2a1650;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #2a1650,0 2.2cqw 3cqw #0008}
#title .t3{font-size:5cqw;font-weight:bold;color:#fff;background:#2a165099;border-radius:3cqw;padding:1cqw 4cqw}
#title .t4{margin-top:3cqw;font-size:6cqw;font-weight:bold;color:#fff;background:#e0562a;border-radius:6cqw;
  padding:2cqw 8cqw;box-shadow:0 1.2cqw 0 #8f2f12;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果（戦利品の袋） */
#result{position:absolute;left:7cqw;right:7cqw;top:22cqw;z-index:30;padding:5cqw 5.5cqw;
  background:#2a1650ee;border:.8cqw solid #ffb347;border-radius:4cqw;
  box-shadow:0 2cqw 0 #00000055,0 3cqw 6cqw #0008;
  display:none;flex-direction:column;align-items:stretch;gap:2cqw;text-align:center;pointer-events:auto}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#result.wait{pointer-events:none}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
#result .hd{font-size:7cqw;font-weight:900;color:#ffb347;line-height:1.2;padding-bottom:1.6cqw;border-bottom:.5cqw solid #ffb34788}
#result .sub{font-size:4.2cqw;color:#d9c8ff;min-height:5.4cqw}
#result .ln{display:flex;justify-content:space-between;align-items:baseline;font-size:4.4cqw;
  border-bottom:.3cqw dashed #ffffff44;padding-bottom:1cqw}
#result .ln span:first-child{color:#d9c8ff}
#result .ln b{font-size:5cqw;color:#fff}
#rBest{font-size:3.8cqw;color:#d9c8ff;min-height:5cqw}
.row{display:flex;gap:3cqw;align-items:center;width:100%;margin-top:1cqw}
.btn{border:0;border-radius:3.6cqw;font:inherit;font-weight:bold;color:#fff;cursor:pointer;
  background:linear-gradient(#ff8a3d,#e0562a);box-shadow:0 1.2cqw 0 #8f2f12;touch-action:manipulation}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .4cqw 0 #8f2f12}
#retry{flex:1;height:14cqw;font-size:5.8cqw}
#share{width:25cqw;height:10cqw;font-size:3.4cqw;background:transparent;color:#ffb347;
  border:.6cqw solid #ffb347;border-radius:3cqw;box-shadow:0 .6cqw 0 #ffb34766}
#share:active{transform:translateY(.5cqw)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="title">
    <div class="t1">ハロウィンの夜</div>
    <div class="t2"><span class="nb">お菓子を</span><span class="nb">食べ続けないと</span><span class="nb">死ぬゲーム</span></div>
    <div class="t3"><span class="nb">朝まで</span><span class="nb">お菓子を切らすな</span></div>
    <div class="t4">タップで スタート</div>
  </div>
  <div id="result">
    <div class="hd" id="rHead"></div>
    <div class="sub" id="rSub"></div>
    <div class="ln"><span>生き延びた時刻</span><b id="rClock"></b></div>
    <div class="ln"><span>食べた数</span><b><span id="rEaten">0</span> 個</b></div>
    <div class="ln"><span>拾った数</span><b><span id="rPicked">0</span> 個</b></div>
    <div class="ln"><span>取られた数</span><b><span id="rStolen">0</span> 個</b></div>
    <div class="ln"><span>のこったお菓子</span><b><span id="rLeft">0</span> 個</b></div>
    <div id="rBest"></div>
    <div class="row">
      <button id="retry" class="btn">もう一回</button>
      <button id="share" class="btn">Xで シェア</button>
    </div>
  </div>
</div>
<script>
// ===== 調整用の数値（遊びながらここを触る）=====
// 論理座標：幅 100 × 高さ 177.8（9:16）。道は x 8〜92。子どもは画面の下 1/4（childY）に固定で、世界のほうが下へ流れる。
const CFG = {
  h: 1 / 60,          // 検証のときの 1 コマ
  dur: 90,            // 21:00 → 6:00 の長さ（秒）
  W: 100, H: 177.8,
  roadL: 8, roadR: 92,
  childY: 135,        // 子どもの画面上の y
  childR: 3.2,
  speed0: 36, speed1: 46,   // 走る速さ（単位/秒）。夜が深まると上がる
  candy0: 10,         // 最初のお菓子の数
  eat0: 1.0, eat1: 0.6,     // お菓子を 1 個食べる間隔（秒）。夜が深まると短くなる
  candyR: 3.2, pumpR: 5.2, ghostR: 4.6,
  pumpLoss: 3, ghostLoss: 3,
  inv: 1.0,           // 取られた後の無敵（秒）
  stun: 0.5,          // カボチャでよろける時間
  stunSlow: 0.55,     // よろけている間の速さの割合
  ghostChase: 9,      // おばけが子どもへ寄る横の速さ
  ghostDrop: 7,       // おばけが世界の中で子どもへ近づく速さ
  ghostWake: 125,     // 画面の上からこの距離に入ったら動き出す
  candyKeep: 0.4,     // 並べるお菓子のうち実際に置く割合（量の調整）
  ghostBase: 0.3, ghostGrow: 0.7,   // 区画ごとに おばけが加わる確率（最初 + 夜が深まるほど）
  ghostEnd: 0.9,      // 夜の進みがここを過ぎると、新しいおばけは出ない（5:30 以降はお化けが減る）
  houseW: 1.0, houseGive: 8,   // 玄関の明かりがついた家：出やすさ・もらえる数
  witchFrom: 0.55, witchW: 1.6, witchLoss: 5,   // 魔女：出始める夜の進み（約 2 時）・出やすさ・取られる数
  witchLaunch: 65, witchSpeed: 75,   // 予告のあと、子どもまでこの距離になったら飛び出す／横の速さ
  witchWarn: 105,     // 予告の線を見せ始める距離
  fatFull: 110,       // この数を食べるとまんまるの最大
  endWin: 3.4, endLose: 2.4,   // 夜明け／イタズラの演出の長さ（秒）
  segLen: 45,         // 区画の長さ
  ahead: 200,         // どこまで先に並べておくか
  keySpeed: 70,       // キーで動く速さ（単位/秒）
  dragGain: 1.25,     // 指の動いた量 → 子どもの動き
  chainTime: 0.8,     // この間隔以内に拾うと連続
  shareUrl: 'https://fish-suika.github.io/okashi-halloween/'
};
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 時刻の表示（21:00 → 6:00）
function clockOf(t) {
  const m = Math.floor(clamp(t / CFG.dur, 0, 1) * 9 * 60);
  const h = (21 + Math.floor(m / 60)) % 24;
  return { h, m: m % 60, text: h + ':' + String(m % 60).padStart(2, '0') };
}

const Game = {
  mode: 'title',          // title → play → end（夜明け／イタズラの演出）→ over（結果）
  result: '', cause: '',  // result: 'win' | 'lose'、cause: お菓子を 0 にした相手（'eat' 'ghost' 'pumpkin' 'witch'）
  endT: 0,
  t: 0, dist: 0, seed: 1, rand: null,
  x: 50, keyDir: 0,
  candy: 0, eaten: 0, picked: 0, stolen: 0, eatT: 0,
  inv: 0, stun: 0, chain: 0, chainT: 0,
  lastHit: 'eat',
  objs: [], nextSeg: 0, lastGap: 50, noSpawn: false,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title'; this.result = ''; this.cause = ''; this.endT = 0;
    this.t = 0; this.dist = 0;
    this.x = 50; this.keyDir = 0;
    this.candy = CFG.candy0; this.eaten = 0; this.picked = 0; this.stolen = 0; this.eatT = 0;
    this.inv = 0; this.stun = 0; this.chain = 0; this.chainT = 99;
    this.lastHit = 'eat';
    this.objs = []; this.nextSeg = 30; this.lastGap = 50; this.noSpawn = false;
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'play';
    this.events.push({ type: 'start' });
  },

  p() { return clamp(this.t / CFG.dur, 0, 1); },
  speed() { return lerp(CFG.speed0, CFG.speed1, this.p()) * (this.stun > 0 ? CFG.stunSlow : 1); },
  eatInterval() { return lerp(CFG.eat0, CFG.eat1, this.p()); },
  fat() { return clamp(this.eaten / CFG.fatFull, 0, 1); },   // 食べた数に合わせて太る（0〜1）
  // 魔女が子どもの高さに来る時点での x（ボットや予告の目安）
  witchAt(o) {
    const dy = o.y - this.dist, sp = this.speed(), arr = Math.max(0, dy / sp);
    const fly = o.launched ? arr : Math.max(0, arr - Math.max(0, (dy - CFG.witchLaunch) / sp));
    return o.x + o.dir * CFG.witchSpeed * fly;
  },

  // 指（またはキー）で左右に動かす。dx は論理単位
  move(dx) {
    if (this.mode !== 'play') return;
    this.x = clamp(this.x + dx, CFG.roadL + CFG.childR, CFG.roadR - CFG.childR);
  },

  add(k, x, y, r) {
    if (k === 'candy' && this.rand() > CFG.candyKeep) return null;   // お菓子の量の調整
    const o = { k, x, y, r, dead: false, ph: this.rand() * 6.28 };
    this.objs.push(o);
    return o;
  },

  // 区画を並べる。obstacles は必ず通れる幅（ゲート 約15、散らばり 約15）を残す
  spawnSeg(y0) {
    const r = this.rand, p = this.p();
    const rnd = (a, b) => a + (b - a) * r();
    let kind;
    if (y0 < 150) kind = r() < 0.5 ? 'line' : 'wave';   // 最初は穏やか
    else {
      const w = [['line', 3], ['wave', 3], ['gate', 1.3 + p * 2], ['bait', 1 + p * 2], ['scatter', 1.2 + p], ['house', CFG.houseW],
                 ['witch', p >= CFG.witchFrom ? CFG.witchW : 0]];
      let sum = 0; for (const a of w) sum += a[1];
      let v = r() * sum; kind = w[0][0];
      for (const a of w) { if (v < a[1]) { kind = a[0]; break; } v -= a[1]; }
    }
    const C = CFG;
    if (kind === 'line') {
      const cx = rnd(18, 82);
      for (let i = 0; i < 6; i++) this.add('candy', cx, y0 + 8 + i * 5.5, C.candyR);
    } else if (kind === 'wave') {
      const cx = rnd(32, 68);
      for (let i = 0; i < 8; i++) this.add('candy', cx + 18 * Math.sin(i * 0.85), y0 + 6 + i * 4.5, C.candyR);
    } else if (kind === 'gate') {
      const g = clamp(this.lastGap + rnd(-35, 35), 24, 76);
      this.lastGap = g;
      for (let px = 12; px <= 88; px += 9) if (Math.abs(px - g) >= 16) this.add('pumpkin', px, y0 + 22, C.pumpR);
      for (let i = 0; i < 5; i++) this.add('candy', g, y0 + 10 + i * 6, C.candyR);
    } else if (kind === 'bait') {
      const gx = r() < 0.5 ? 24 : 76, gy = y0 + 28;
      this.add('ghost', gx, gy, C.ghostR);
      for (let i = 0; i < 5; i++) {   // おばけのそばのお菓子（危ない）
        const a = -0.9 + i * 0.45;
        this.add('candy', gx + (gx < 50 ? 1 : -1) * 11 * Math.cos(a), gy + 11 * Math.sin(a), C.candyR);
      }
      const sx = 100 - gx;            // 反対側の安全なお菓子
      for (let i = 0; i < 3; i++) this.add('candy', sx, y0 + 8 + i * 6, C.candyR);
    } else if (kind === 'scatter') {
      const xs = [rnd(14, 24), rnd(44, 56), rnd(76, 86)];
      xs.forEach((px, i) => this.add('pumpkin', px, y0 + 16 + (i % 2) * 10 + rnd(0, 4), C.pumpR));
      for (let i = 0; i < 6; i++) {
        const gx = i % 2 ? 66 : 34;
        this.add('candy', gx + rnd(-3, 3), y0 + 12 + (i >> 1) * 8, C.candyR);
      }
    }
    else if (kind === 'house') {
      // 玄関の明かりがついた家（道の端）。そばにカボチャとおばけが寄りやすい
      const left = r() < 0.5, hx = left ? 10 : 90, dir = left ? 1 : -1;
      this.add('house', hx, y0 + 24, 6);
      this.add('pumpkin', hx + dir * 15, y0 + 26, C.pumpR);
      this.add('ghost', hx + dir * 28, y0 + 38, C.ghostR);
      for (let i = 0; i < 3; i++) this.add('candy', 100 - hx, y0 + 12 + i * 7, C.candyR);
    } else if (kind === 'witch') {
      // 魔女のほうき：予告してから横から一直線に横切る
      const dir = r() < 0.5 ? 1 : -1;
      const w = this.add('witch', dir > 0 ? -10 : 110, y0 + 28, 6);
      w.dir = dir; w.launched = false;
      const cx = rnd(20, 80);
      for (let i = 0; i < 5; i++) this.add('candy', cx, y0 + 4 + i * 4.5, C.candyR);   // 通り道の手前のお菓子
    }
    // 夜が深まるほど、おばけが加わる（朝が近づくと減る）
    if (kind !== 'bait' && kind !== 'house' && p < C.ghostEnd) {
      const n = (r() < C.ghostBase + p * C.ghostGrow ? 1 : 0) + (p > 0.4 && r() < 0.6 ? 1 : 0);
      for (let i = 0; i < n; i++) this.add('ghost', rnd(20, 80), y0 + 36 + i * 4, C.ghostR);
    }
  },

  loseCandy(n, by) {
    const m = Math.min(this.candy, n);
    this.candy -= m; this.stolen += m;
    this.lastHit = by;
    if (this.candy <= 0) this.finish('lose', by);
    return m;
  },

  finish(result, cause) {
    if (this.mode !== 'play') return;
    this.mode = 'end'; this.endT = 0; this.result = result; this.cause = cause || '';
    if (result === 'win') for (const o of this.objs) if (o.k === 'ghost' || o.k === 'witch') { o.flee = true; o.fade = 0; }   // お化けが一斉に逃げていく
    this.events.push({ type: 'end', result, cause: this.cause });
  },

  // 夜明け／イタズラの演出の間。終わったら結果へ
  stepEnd(dt) {
    this.endT += dt;
    if (this.result === 'win') this.dist += lerp(CFG.speed1, 0, clamp(this.endT / 1.2, 0, 1)) * dt;   // 立ち止まる
    for (const o of this.objs) if (o.flee) { o.y += 30 * dt; o.fade = (o.fade || 0) + dt; }
    if (this.endT >= (this.result === 'win' ? CFG.endWin : CFG.endLose)) {
      this.mode = 'over';
      this.events.push({ type: 'over' });
    }
  },

  step(dt) {
    if (this.mode === 'end') { this.stepEnd(dt); return; }
    if (this.mode !== 'play') return;
    const C = CFG;
    this.t += dt;
    if (this.t >= C.dur) { this.t = C.dur; this.finish('win', ''); return; }
    if (this.keyDir) this.move(this.keyDir * C.keySpeed * dt);
    this.dist += this.speed() * dt;
    this.inv = Math.max(0, this.inv - dt);
    this.stun = Math.max(0, this.stun - dt);
    this.chainT += dt;

    if (!this.noSpawn) while (this.nextSeg < this.dist + C.ahead) { this.spawnSeg(this.nextSeg); this.nextSeg += C.segLen; }

    // 勝手に食べる
    this.eatT += dt;
    const iv = this.eatInterval();
    while (this.eatT >= iv && this.mode === 'play') {
      this.eatT -= iv;
      this.candy--; this.eaten++;
      this.events.push({ type: 'eat' });
      if (this.candy <= 0) { this.candy = 0; this.lastHit = 'eat'; this.finish('lose', 'eat'); }
    }
    if (this.mode !== 'play') return;

    // 物の動きと当たり
    for (const o of this.objs) {
      if (o.dead) continue;
      if (o.k === 'ghost') {
        if (o.flee) { o.y += 30 * dt; o.fade = (o.fade || 0) + dt; if (o.fade > 0.5) o.dead = true; continue; }
        if (o.y - this.dist < C.ghostWake) {
          const vx = clamp(this.x - o.x, -1, 1) * C.ghostChase + Math.sin(this.t * 2.2 + o.ph) * 9;
          o.x = clamp(o.x + vx * dt, C.roadL + 3, C.roadR - 3);
          o.y -= C.ghostDrop * dt;
        }
      }
      if (o.k === 'witch') {
        if (o.flee) { o.fade = (o.fade || 0) + dt; if (o.fade > 0.5) o.dead = true; continue; }
        if (!o.launched && o.y - this.dist < C.witchLaunch) { o.launched = true; this.events.push({ type: 'witch' }); }
        if (o.launched) o.x += o.dir * C.witchSpeed * dt;
        if (o.x < -25 || o.x > 125) { o.dead = true; continue; }
        if (!o.launched) continue;
      }
      if (o.hit || o.used) continue;
      const dx = this.x - o.x, dy = this.dist - o.y, rr = C.childR + o.r;
      if (dx * dx + dy * dy >= rr * rr) continue;
      if (o.k === 'house') {
        o.used = true; this.candy += C.houseGive; this.picked += C.houseGive;
        this.events.push({ type: 'house', n: C.houseGive, x: o.x, y: o.y });
      } else if (o.k === 'candy') {
        o.dead = true; this.candy++; this.picked++;
        this.chain = this.chainT <= C.chainTime ? this.chain + 1 : 1;
        this.chainT = 0;
        this.events.push({ type: 'pick', chain: this.chain, x: o.x, y: o.y });
      } else if (this.inv <= 0) {
        if (o.k === 'pumpkin') {
          o.hit = true;
          this.inv = C.inv; this.stun = C.stun;
          const m = this.loseCandy(C.pumpLoss, 'pumpkin');
          this.events.push({ type: 'hit', k: 'pumpkin', n: m, x: o.x, y: o.y });
        } else if (o.k === 'ghost') {
          o.flee = true;
          this.inv = C.inv;
          const m = this.loseCandy(C.ghostLoss, 'ghost');
          this.events.push({ type: 'hit', k: 'ghost', n: m, x: o.x, y: o.y });
        } else if (o.k === 'witch') {
          o.hit = true;
          this.inv = C.inv;
          const m = this.loseCandy(C.witchLoss, 'witch');
          this.events.push({ type: 'hit', k: 'witch', n: m, x: o.x, y: o.y });
        }
        if (this.mode !== 'play') return;
      }
    }
    // 後ろに過ぎた物を捨てる
    const lim = this.dist - 40;
    if (this.objs.length && this.objs.some(o => o.y < lim || o.dead)) this.objs = this.objs.filter(o => !o.dead && o.y >= lim);
  }
};
// ===== 描画（ハロウィンの夜）。絵は全部 Canvas で描く =====
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const FONT = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
let S = 1, OX = 0, OY = 0, DPR = 1, nowT = 0, shakeT = 0, munchT = 0, vw = 0, vh = 0;
const popups = [], parts = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * DPR); cv.height = Math.round(vh * DPR);
  S = Math.min(vw / CFG.W, vh / CFG.H) * DPR;
  OX = (cv.width - CFG.W * S) / 2; OY = (cv.height - CFG.H * S) / 2;
}
const sx = x => OX + x * S;
const sy = y => OY + y * S;
const ly = o => CFG.childY - (o.y - Game.dist);   // 物の画面上の y（論理座標）
// 画面に見えている論理座標の範囲（横長・縦長の端末でも背景を端まで描くため）
function view() { return { x0: -OX / S, x1: (cv.width - OX) / S, y0: -OY / S, y1: (cv.height - OY) / S }; }
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function addPopup(text, x, y, size, color, life) { popups.push({ text, x, y, size, color, life: life || 0.8, t: 0 }); }
function burst(x, y, color, n, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832, v = (0.4 + Math.random() * 0.6) * (speed || 30);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 8, life: (life || 0.6) * (0.6 + Math.random() * 0.5), t: 0, color, size: 0.7 + Math.random() * 0.9 });
  }
}

function updateVisual(dt) {
  shakeT = Math.max(0, shakeT - dt);
  munchT = Math.max(0, munchT - dt);
  for (const p of popups) p.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > popups[i].life) popups.splice(i, 1);
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t > parts[i].life) parts.splice(i, 1);
  // 朝日のきらきら
  if (Game.result === 'win' && Game.mode !== 'title' && Math.random() < 0.5) {
    const v = view();
    parts.push({ x: v.x0 + Math.random() * (v.x1 - v.x0), y: Math.random() * 60, vx: 0, vy: 6, life: 1.2, t: 0, color: '#fff6c8', size: 0.8 });
  }
}

function circle(x, y, r, fill, stroke, lw) {
  g.beginPath(); g.arc(sx(x), sy(y), r * S, 0, 6.2832);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 0.6) * S; g.stroke(); }
}
function rect(x, y, w, h, fill) { g.fillStyle = fill; g.fillRect(sx(x), sy(y), w * S, h * S); }
function glow(x, y, r, color, a) {
  const gr = g.createRadialGradient(sx(x), sy(y), 0, sx(x), sy(y), r * S);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = a; g.fillStyle = gr; g.fillRect(sx(x - r), sy(y - r), r * 2 * S, r * 2 * S); g.globalAlpha = 1;
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// ---------- 背景 ----------
const HOUSE_COL = ['#4a2f6b', '#3b3f7a', '#5a2f5a', '#2f4a6b', '#6b3f4a', '#3f5a4a'];
function drawSideHouses(v) {
  const C = CFG, top = Game.dist + C.childY - v.y1 - 40, bot = Game.dist + C.childY - v.y0 + 40;
  for (let i = Math.floor(top / 38); i <= Math.ceil(bot / 38); i++) {
    const y = C.childY - (i * 38 - Game.dist);
    for (const side of [-1, 1]) {
      for (let row = 0; row < 6; row++) {
        const edge = side < 0 ? C.roadL - 4 - row * 22 : C.roadR + 4 + row * 22;   // 道に近い側の端
        const x0 = side < 0 ? edge - 16 : edge, x1 = x0 + 16;
        if (x1 < v.x0 - 2 || x0 > v.x1 + 2) continue;
        const h = hash(i * 7 + row, side + 3);
        if (h < 0.12) {   // 木
          circle((x0 + x1) / 2, y, 7 + h * 10, '#241d3d', null);
          circle((x0 + x1) / 2 - 2, y - 2, 5, '#2c2348', null);
          continue;
        }
        const wall = HOUSE_COL[Math.floor(h * 97) % HOUSE_COL.length];
        rect(x0, y - 12, 16, 24, wall);
        rect(x0, y - 12, 16, 9, 'rgba(0,0,0,0.35)');           // 屋根の影
        rect(x0 + 1, y - 12, 14, 1.2, 'rgba(255,255,255,0.12)');   // 屋根のふち
        const lit = hash(i + row * 31, side * 5 + 11) < 0.55;
        const fx = side < 0 ? x1 - 3.5 : x0 + 0.5;               // 道に向いた壁の窓
        rect(fx, y - 7, 3, 3.5, lit ? '#ffcf5a' : '#262040');
        rect(fx, y + 1, 3, 3.5, lit && h > 0.5 ? '#ffb347' : '#262040');
        if (row === 0 && lit) glow(side < 0 ? C.roadL + 1 : C.roadR - 1, y, 14, 'rgba(255,200,90,0.9)', 0.22);
        if (row === 0 && h > 0.6) {                                // 玄関先のカボチャ
          const px = side < 0 ? C.roadL - 2.2 : C.roadR + 2.2;
          circle(px, y + 6, 1.9, '#f07a1a', null);
          glow(px, y + 6, 5, 'rgba(255,180,60,0.9)', 0.35);
        }
      }
    }
  }
}

function drawBackground(v) {
  const C = CFG, p = Game.p();
  // 空（画面の上ほど遠く）。夜が明けるにつれて地平線が赤く → 明るく
  const k = p * p;
  const sky = g.createLinearGradient(0, 0, 0, cv.height);
  sky.addColorStop(0, `rgb(${Math.round(lerp(18, 150, k))},${Math.round(lerp(12, 110, k))},${Math.round(lerp(44, 160, k))})`);
  sky.addColorStop(0.45, `rgb(${Math.round(lerp(34, 120, k))},${Math.round(lerp(24, 80, k))},${Math.round(lerp(72, 120, k))})`);
  sky.addColorStop(1, '#2a1f4a');
  g.fillStyle = sky; g.fillRect(0, 0, cv.width, cv.height);
  // 星
  g.fillStyle = '#fff';
  for (let i = 0; i < 40; i++) {
    const a = 1 - p * 1.3;
    if (a <= 0) break;
    g.globalAlpha = a * (0.4 + 0.4 * Math.sin(nowT * 2 + i));
    const x = (hash(i, 1) * (v.x1 - v.x0)) + v.x0, y = hash(i, 2) * 50 + v.y0;
    g.fillRect(sx(x), sy(y), 0.7 * S, 0.7 * S);
  }
  g.globalAlpha = 1;
  // 両側の地面（歩道）
  g.fillStyle = '#2b2447'; g.fillRect(0, 0, sx(C.roadL), cv.height); g.fillRect(sx(C.roadR), 0, cv.width, cv.height);
  g.fillStyle = '#4a4268';
  g.fillRect(sx(C.roadL - 4), 0, 4 * S, cv.height); g.fillRect(sx(C.roadR), 0, 4 * S, cv.height);
  drawSideHouses(v);
  // 道
  g.fillStyle = '#3a3258'; g.fillRect(sx(C.roadL), 0, (C.roadR - C.roadL) * S, cv.height);
  g.fillStyle = '#2f2750';   // 縁と、道のひび
  g.fillRect(sx(C.roadL), 0, 0.8 * S, cv.height); g.fillRect(sx(C.roadR) - 0.8 * S, 0, 0.8 * S, cv.height);
  g.fillStyle = '#ffffff22';
  const off = ((Game.dist % 24) + 24) % 24;
  for (let y = v.y0 - 24; y < v.y1 + 24; y += 24) rect(49.5, y + off, 1, 9, '#ffffff22');
  // 遠くのもや
  const fog = g.createLinearGradient(0, 0, 0, cv.height * 0.35);
  fog.addColorStop(0, 'rgba(26,18,54,0.7)'); fog.addColorStop(1, 'rgba(26,18,54,0)');
  g.fillStyle = fog; g.fillRect(0, 0, cv.width, cv.height * 0.35);
  // 月（沈んでいく）と朝日
  if (p < 0.78) { const my = 16 + p * 22; g.globalAlpha = 1 - p / 0.78; glow(20, my, 16, 'rgba(255,246,200,1)', 0.35); circle(20, my, 6, '#fff6c8', null); circle(18.4, my - 1.2, 1.3, 'rgba(200,190,150,0.5)', null); circle(21.5, my + 1.6, 0.9, 'rgba(200,190,150,0.5)', null); g.globalAlpha = 1; }
  if (p > 0.8) {
    const s = clamp((p - 0.8) / 0.2, 0, 1);
    glow(50, 6 - (1 - s) * -14, 70, 'rgba(255,190,110,1)', 0.55 * s);
  }

  if (Game.result === 'win') { g.fillStyle = `rgba(255,214,120,${0.38 * endK(1.2)})`; g.fillRect(0, 0, cv.width, cv.height); }
}

// ---------- 物 ----------
function drawCandy(o, y) {
  const kind = Math.floor(o.ph / 6.2832 * 5), r = o.r * 0.85, b = Math.sin(nowT * 5 + o.ph) * 0.35;
  y += b;
  glow(o.x, y, r * 2.2, 'rgba(255,230,140,1)', 0.28);
  if (kind === 0) {          // 包み飴
    g.fillStyle = '#ff5fa0';
    g.beginPath(); g.moveTo(sx(o.x - r * 1.9), sy(y - r * 0.8)); g.lineTo(sx(o.x - r * 0.6), sy(y)); g.lineTo(sx(o.x - r * 1.9), sy(y + r * 0.8)); g.fill();
    g.beginPath(); g.moveTo(sx(o.x + r * 1.9), sy(y - r * 0.8)); g.lineTo(sx(o.x + r * 0.6), sy(y)); g.lineTo(sx(o.x + r * 1.9), sy(y + r * 0.8)); g.fill();
    circle(o.x, y, r * 0.9, '#ff8ec0', '#c93a7a', 0.4);
  } else if (kind === 1) {   // ぐるぐるキャンディ
    circle(o.x, y, r, '#fff', '#e64a4a', 0.5);
    circle(o.x, y, r * 0.55, '#e64a4a', null); circle(o.x, y, r * 0.2, '#fff', null);
  } else if (kind === 2) {   // チョコ
    rect(o.x - r, y - r * 0.7, r * 2, r * 1.4, '#6b3a1e'); rect(o.x - r * 0.6, y - r * 0.4, r * 1.2, r * 0.8, '#8a4e2a');
  } else if (kind === 3) {   // クッキー
    circle(o.x, y, r, '#d9a45a', '#a8702a', 0.4);
    circle(o.x - r * 0.35, y - r * 0.2, r * 0.17, '#5a3418', null); circle(o.x + r * 0.3, y + r * 0.25, r * 0.17, '#5a3418', null); circle(o.x + r * 0.1, y - r * 0.4, r * 0.13, '#5a3418', null);
  } else {                    // 星の飴
    g.fillStyle = '#ffd23f'; g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -1.5708 + i * 0.6283, rad = i % 2 ? r * 0.5 : r * 1.1; g.lineTo(sx(o.x + Math.cos(a) * rad), sy(y + Math.sin(a) * rad)); }
    g.closePath(); g.fill(); g.strokeStyle = '#b8860b'; g.lineWidth = 0.4 * S; g.stroke();
  }
}
function drawPumpkin(o, y) {
  const r = o.r;
  circle(o.x, y + r * 0.9, r * 0.95, 'rgba(0,0,0,0.25)', null);   // 影
  circle(o.x - r * 0.45, y, r * 0.75, '#e8681a', '#8a3d00', 0.5);
  circle(o.x + r * 0.45, y, r * 0.75, '#e8681a', '#8a3d00', 0.5);
  circle(o.x, y, r * 0.8, '#f07a1a', '#8a3d00', 0.6);
  rect(o.x - 0.6, y - r - 1.2, 1.2, 2.2, '#4a7a2a');              // へた
  glow(o.x, y, r * 1.6, 'rgba(255,200,60,1)', 0.35);
  g.fillStyle = '#ffe27a';                                           // 光る顔
  g.beginPath(); g.moveTo(sx(o.x - r * 0.55), sy(y - r * 0.15)); g.lineTo(sx(o.x - r * 0.2), sy(y - r * 0.15)); g.lineTo(sx(o.x - r * 0.38), sy(y - r * 0.55)); g.fill();
  g.beginPath(); g.moveTo(sx(o.x + r * 0.55), sy(y - r * 0.15)); g.lineTo(sx(o.x + r * 0.2), sy(y - r * 0.15)); g.lineTo(sx(o.x + r * 0.38), sy(y - r * 0.55)); g.fill();
  g.beginPath(); g.moveTo(sx(o.x - r * 0.55), sy(y + r * 0.2)); g.lineTo(sx(o.x + r * 0.55), sy(y + r * 0.2));
  g.lineTo(sx(o.x + r * 0.35), sy(y + r * 0.55)); g.lineTo(sx(o.x - r * 0.35), sy(y + r * 0.55)); g.fill();
}
function drawGhostBody(x, y, r, a, face) {
  g.globalAlpha = a;
  glow(x, y, r * 2, 'rgba(190,170,255,1)', 0.3 * a);
  g.fillStyle = '#f4f0ff'; g.strokeStyle = '#8a78c8'; g.lineWidth = 0.5 * S;
  g.beginPath();
  g.arc(sx(x), sy(y - r * 0.15), r * S, Math.PI, 0);
  g.lineTo(sx(x + r), sy(y + r * 0.9));
  for (let i = 0; i < 4; i++) g.quadraticCurveTo(sx(x + r - (i + 0.5) * r * 0.5), sy(y + r * 0.9 + (i % 2 ? -1 : 1.2)), sx(x + r - (i + 1) * r * 0.5), sy(y + r * 0.9));
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#2a1650';
  if (face === 'scared') {   // 逃げるとき
    rect(x - r * 0.5, y - r * 0.4, r * 0.3, r * 0.15, '#2a1650'); rect(x + r * 0.25, y - r * 0.4, r * 0.3, r * 0.15, '#2a1650');
    circle(x, y + r * 0.25, r * 0.15, '#2a1650', null);
  } else {
    circle(x - r * 0.35, y - r * 0.25, r * 0.17, '#2a1650', null); circle(x + r * 0.35, y - r * 0.25, r * 0.17, '#2a1650', null);

    rect(x - r * 0.62, y + r * 0.05, r * 0.28, r * 0.15, 'rgba(255,140,170,0.6)'); rect(x + r * 0.34, y + r * 0.05, r * 0.28, r * 0.15, 'rgba(255,140,170,0.6)');
  }
  g.globalAlpha = 1;
}
function drawGhost(o, y) {
  const w = Math.sin(nowT * 3 + o.ph) * 1.4, bob = Math.sin(nowT * 4 + o.ph) * 0.8;
  const a = o.flee ? Math.max(0, 1 - (o.fade || 0) / 0.6) : 0.95;
  drawGhostBody(o.x + w, y + bob, o.r, a, o.flee ? 'scared' : '');
  if (!o.flee && o.y - Game.dist < 40 && o.y - Game.dist > 0) {   // せがむ吹き出し
    g.globalAlpha = 0.85; g.font = '900 ' + 3.4 * S + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 0.9 * S; g.strokeStyle = '#2a1650'; g.fillStyle = '#fff';
    g.strokeText('ちょうだい', sx(o.x + w), sy(y - o.r * 1.9)); g.fillText('ちょうだい', sx(o.x + w), sy(y - o.r * 1.9));

// 玄関の明かりがついた家（道の端）。ドアに近づくと住人が「どうぞ」
function drawHouse(o, y) {
  const left = o.x < 50, x0 = left ? 0 : 84, w = 16, lit = !o.used;
  rect(x0, y - 11, w, 22, '#5a3a80');
  rect(x0, y - 11, w, 8, 'rgba(0,0,0,0.3)');
  g.fillStyle = '#2a1650'; g.beginPath();
  g.moveTo(sx(x0 - 1), sy(y - 10)); g.lineTo(sx(x0 + w / 2), sy(y - 19)); g.lineTo(sx(x0 + w + 1), sy(y - 10)); g.fill();
  rect(x0 + 2, y - 6, 4, 4, lit ? '#ffcf5a' : '#6b5a8a'); rect(x0 + 10, y - 6, 4, 4, lit ? '#ffcf5a' : '#6b5a8a');
  const dx = left ? x0 + w - 5.5 : x0 + 0.5;                                  // ドアは道側
  rect(dx, y, 5, 11, lit ? '#ff9a3d' : '#3a2858');
  if (lit) {
    glow(left ? 14 : 86, y + 5, 16, 'rgba(255,200,90,1)', 0.45 + 0.1 * Math.sin(nowT * 4));
    circle(left ? 11 : 89, y + 10, 2.2, '#f07a1a', null);                      // 玄関先のカボチャ
  } else {
    // 住人がドアから手を振る
    circle(left ? 14 : 86, y + 3, 2, '#ffe0b8', null);
  }
}

// 魔女のほうき：予告（通る列が光る）→ 横切る
function drawWitch(o, y) {
  const dy = o.y - Game.dist, C = CFG;
  if (!o.launched) {
    if (dy > C.witchWarn) return;
    const pulse = 0.5 + 0.5 * Math.sin(nowT * 16);
    g.globalAlpha = 0.14 + 0.14 * pulse;
    rect(C.roadL, y - 7, C.roadR - C.roadL, 14, '#ff5a5a');
    g.globalAlpha = 0.55 + 0.4 * pulse;
    const ex = o.dir > 0 ? C.roadL + 5 : C.roadR - 5;
    g.fillStyle = '#ff5a5a'; g.font = '900 ' + 10 * S + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 1.2 * S; g.strokeStyle = '#2a1650'; g.strokeText('!', sx(ex), sy(y)); g.fillText('!', sx(ex), sy(y));
    g.globalAlpha = 1;
    return;
  }
  const a = o.flee ? Math.max(0, 1 - (o.fade || 0) / 0.5) : 1, d = o.dir;
  g.globalAlpha = a;
  for (let i = 1; i <= 5; i++) { g.globalAlpha = a * (0.5 - i * 0.09); circle(o.x - d * (8 + i * 3), y + 1 + Math.sin(nowT * 20 + i) * 0.8, 1.2 - i * 0.12, '#c8a6ff', null); }
  g.globalAlpha = a;
  g.strokeStyle = '#8a5a2b'; g.lineWidth = 1 * S;                              // ほうきの柄
  g.beginPath(); g.moveTo(sx(o.x - d * 9), sy(y + 1.5)); g.lineTo(sx(o.x + d * 8), sy(y + 1.5)); g.stroke();
  g.fillStyle = '#d6a64a'; g.beginPath();                                      // 穂
  g.moveTo(sx(o.x - d * 8), sy(y + 1.5)); g.lineTo(sx(o.x - d * 14), sy(y - 1)); g.lineTo(sx(o.x - d * 14), sy(y + 4)); g.fill();
  circle(o.x, y - 1.5, 3.2, '#6b3fa0', '#2a1650', 0.5);                        // 魔女
  circle(o.x + d * 1.2, y - 1.8, 0.7, '#7aff7a', null);
  g.fillStyle = '#2a1650'; g.beginPath();                                      // とんがり帽子
  g.moveTo(sx(o.x - 4.5), sy(y - 3.8)); g.lineTo(sx(o.x + 4.5), sy(y - 3.8)); g.lineTo(sx(o.x - d * 1.5), sy(y - 12)); g.fill();
  rect(o.x - 2.4, y - 5.2, 4.8, 1, '#ffb347');
  g.globalAlpha = 1;
}

// ---------- 子ども ----------
function endK(span) { return Game.mode === 'over' ? 1 : Game.mode === 'end' ? clamp(Game.endT / span, 0, 1) : 0; }

function drawChild(x, y) {
  const blink = Game.inv > 0 && Math.floor(nowT * 14) % 2 === 0 && Game.mode === 'play';
  const fatK = Game.result === 'win' ? Game.fat() * clamp((Game.mode === 'over' ? 9 : Game.endT - 1.0) / 1.6, 0, 1) : 0;
  const frog = Game.result === 'lose' && Game.cause === 'witch' && endK(0.9) > 0.5;
  if (frog) { drawFrog(x, y); drawPrank(x, y); return; }
  if (blink) g.globalAlpha = 0.35;
  const r = CFG.childR * (1 + fatK * 0.9);
  const run = Game.mode === 'play' || Game.mode === 'title' ? Math.sin(Game.dist * 0.55) : 0;
  const candy = Game.candy, scared = candy <= 3 && Game.mode === 'play', worried = candy <= 6 && Game.mode === 'play';
  circle(x, y + r * 0.9, r * 0.95, 'rgba(0,0,0,0.28)', null);                 // 影
  // しっぽ（猫）
  g.strokeStyle = '#1a1a26'; g.lineWidth = 1.2 * S; g.lineCap = 'round';
  g.beginPath(); g.moveTo(sx(x), sy(y + r * 0.7)); g.quadraticCurveTo(sx(x + Math.sin(nowT * 7) * 3.5), sy(y + r + 3), sx(x + Math.sin(nowT * 7 + 1) * 4.5), sy(y + r + 6)); g.stroke();
  // 足
  rect(x - r * 0.6 + run * 0.9, y + r * 0.55, r * 0.5, r * 0.7, '#1a1a26'); rect(x + r * 0.1 - run * 0.9, y + r * 0.55, r * 0.5, r * 0.7, '#1a1a26');
  // 耳
  g.fillStyle = '#1a1a26';
  g.beginPath(); g.moveTo(sx(x - r * 0.95), sy(y - r * 0.3)); g.lineTo(sx(x - r * 0.8), sy(y - r * 1.65)); g.lineTo(sx(x - r * 0.1), sy(y - r * 0.85)); g.fill();
  g.beginPath(); g.moveTo(sx(x + r * 0.95), sy(y - r * 0.3)); g.lineTo(sx(x + r * 0.8), sy(y - r * 1.65)); g.lineTo(sx(x + r * 0.1), sy(y - r * 0.85)); g.fill();
  g.fillStyle = '#ff8fb8';

function drawFrog(x, y) {
  const r = CFG.childR * 1.15;
  circle(x, y + 1, r, '#58b848', '#2c6b24', 0.6);
  circle(x - r * 0.55, y - r * 0.7, r * 0.42, '#fff', '#2c6b24', 0.4);

// 負けたときの大げさなイタズラ（0 にした相手で変わる）
function drawPrank(x, y) {

// ---------- 全体 ----------
function render() {

  for (const o of Game.objs) {
    const y = ly(o);

    else if (o.k === 'pumpkin') drawPumpkin(o, y);
    else if (o.k === 'ghost') drawGhost(o, y);
    else if (o.k === 'house') drawHouse(o, y);

  }

  // きらきら

    const vg = g.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.35, cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * 0.7);

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + (low ? 12 : 10) * S + 'px ' + FONT;
  g.lineWidth = 1.4 * S; g.strokeStyle = '#2a1650';

  g.font = '900 ' + 7 * S + 'px ' + FONT;
  const tw = g.measureText(ck).width + 12 * S, th = 11 * S, tx = sx(50) - tw / 2, ty = sy(5);
  g.fillStyle = 'rgba(26,18,54,0.6)'; rr(g, tx, ty, tw, th, th / 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(ck, tx + 9 * S, ty + th / 2 + 0.3 * S);
  circle(50 - tw / S / 2 + 4.2, 10.5, 2.2, day ? '#ffb347' : '#fff6c8', null);
  if (!day) circle(50 - tw / S / 2 + 5.1, 10, 1.9, 'rgb(40,30,80)', null);
  g.textAlign = 'center';

    g.lineWidth = 1.2 * S; g.strokeStyle = '#2a1650'; g.fillStyle = q.color;

}
// ===== 効果音（WebAudio で合成。音声ファイルなし・BGMなし。もぐもぐのリズムが音楽の代わり）=====
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null;
  function init() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        const comp = ac.createDynamicsCompressor();   // 重なっても割れないように
        comp.threshold.value = -14; comp.ratio.value = 6;

        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (_) { ac = null; return; }
    }
    if (ac.state === 'suspended') ac.resume();

    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f * o.slide), t0 + dur);
    if (o.vib) {
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = o.vib; lg.gain.value = f * 0.04;
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t0); lfo.stop(t0 + dur + 0.05);
    }
    const v = o.vol == null ? 0.4 : o.vol;
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gn); gn.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  // 雑音（もぐもぐ・風切り）
  function noise(dur, o) {
    if (!ac) return;

    const fl = ac.createBiquadFilter(); fl.type = o.type || 'bandpass';
    fl.frequency.setValueAtTime(o.f || 1200, t0); fl.Q.value = o.q || 1;
    if (o.sweep) fl.frequency.exponentialRampToValueAtTime(o.sweep, t0 + dur);

    src.connect(fl); fl.connect(gn); gn.connect(master);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9];   // 連続で拾うと音が上がっていく
  function chainFreq(n) { const i = Math.min(n - 1, 14); return 523 * Math.pow(2, (PENTA[i % 5] + 12 * Math.floor(i / 5)) / 12); }

  return {
    init,
    pick(chain) { const f = chainFreq(chain); tone(f, 0.14, { type: 'triangle', vol: 0.45 }); tone(f * 2, 0.1, { type: 'sine', vol: 0.18, delay: 0.02 }); },
    eat(low) {
      noise(0.05, { f: 1800, q: 2, vol: 0.3 }); tone(160, 0.06, { type: 'square', vol: 0.08, slide: 0.6 });
      if (low) { tone(880, 0.07, { type: 'square', vol: 0.15 }); tone(880, 0.07, { type: 'square', vol: 0.15, delay: 0.12 }); }   // 残りわずか
    },
    hitPumpkin() { tone(140, 0.25, { type: 'sine', vol: 0.55, slide: 0.45 }); tone(300, 0.15, { type: 'square', vol: 0.12, slide: 0.5 }); noise(0.12, { f: 400, vol: 0.3 }); },
    hitGhost() { tone(620, 0.55, { type: 'sine', vol: 0.4, slide: 0.4, vib: 9 }); tone(930, 0.5, { type: 'sine', vol: 0.15, slide: 0.4, vib: 9, delay: 0.03 }); },
    hitWitch() { noise(0.3, { f: 3000, sweep: 400, vol: 0.35, q: 1.5 }); tone(200, 0.4, { type: 'sawtooth', vol: 0.2, slide: 0.5 }); },
    house() { [660, 830, 990, 1320].forEach((f, i) => tone(f, 0.22, { type: 'triangle', vol: 0.4, delay: i * 0.075 })); },
    witch() { noise(0.7, { f: 500, sweep: 2600, vol: 0.18, q: 1.2 }); tone(300, 0.7, { type: 'sine', vol: 0.08, slide: 2.2, vib: 14 }); },
    dawn() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.4, delay: i * 0.16 })); tone(2400, 0.12, { type: 'sine', vol: 0.1, delay: 0.9, slide: 1.3 }); tone(2800, 0.1, { type: 'sine', vol: 0.1, delay: 1.1, slide: 1.3 }); },
    prank() {   // 大げさなイタズラ：ずっこけ音とボヨン
      tone(500, 0.6, { type: 'sawtooth', vol: 0.3, slide: 0.35, vib: 6 });
      tone(160, 0.3, { type: 'sine', vol: 0.5, slide: 3, delay: 0.55 }); tone(300, 0.25, { type: 'triangle', vol: 0.3, slide: 0.5, delay: 0.85 });
    },
    stamp() { tone(300, 0.18, { type: 'sine', vol: 0.4, slide: 0.5 }); }
  };
})();
// ===== 操作・ループ・結果 =====
const BEST_KEY = 'okashi-halloween-best';
function loadBest() { try { return parseFloat(localStorage.getItem(BEST_KEY)) || 0; } catch (_) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (_) {} }
const fmt = n => n.toLocaleString('ja-JP');

let shownResult = false, last = 0;
// 最後にお菓子を取った相手ごとのイタズラ
const PRANK_TEXT = {
  ghost: 'シーツをかぶせられて、おばけの仲間に',
  pumpkin: '頭に カボチャを かぶせられた',
  witch: 'カエルに されちゃった',
  eat: '顔じゅう 落書きされた'
};
const PRANK_POP = { ghost: 'おばけの 仲間入り！', pumpkin: 'カボチャ ずきん！', witch: 'ケロッ！', eat: 'らくがき！' };

function bindUI() {
  // 指を動かした量で子どもを動かす（指の位置には合わせない）
  let dragId = null, lastX = 0;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    Snd.init();
    if (Game.mode === 'title') { Game.begin(); }
    dragId = e.pointerId; lastX = e.clientX;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== dragId) return;
    const dx = (e.clientX - lastX) / (S / DPR);   // 論理単位
    lastX = e.clientX;
    Game.move(dx * CFG.dragGain);
  });
  const up = e => { if (e.pointerId === dragId) dragId = null; };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); Game.keyDir = -1; if (Game.mode === 'title') { Snd.init(); Game.begin(); } }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); Game.keyDir = 1; if (Game.mode === 'title') { Snd.init(); Game.begin(); } }
    else if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (Game.mode === 'title') { Snd.init(); Game.begin(); }
      else if (Game.mode === 'over' && !$('result').classList.contains('wait')) { Snd.init(); retry(); }
    }
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if ((k === 'ArrowLeft' || k === 'a' || k === 'A') && Game.keyDir < 0) Game.keyDir = 0;
    if ((k === 'ArrowRight' || k === 'd' || k === 'D') && Game.keyDir > 0) Game.keyDir = 0;
  });
  window.addEventListener('resize', resize);
  window.addEventListener('contextmenu', e => e.preventDefault());
  $('retry').addEventListener('click', () => { Snd.init(); retry(); });
  $('share').addEventListener('click', share);
}

function retry() {
  Game.reset();
  shownResult = false;
  popups.length = 0; parts.length = 0; munchT = 0;
  $('result').classList.remove('show', 'wait');
  $('title').classList.remove('hide');
  Game.begin();   // 「もう一回」は前置きなしですぐ走る
  $('title').classList.add('hide');
}

function showResult() {
  shownResult = true;
  const win = Game.result === 'win';
  $('rHead').textContent = win ? '朝まで 生き延びた！' : 'お菓子が 切れた…';
  const f = Game.fat();
  $('rSub').textContent = win ? (f >= 0.75 ? 'ぱんぱんの まんまる！' : f >= 0.45 ? 'ちょっと まるくなった' : 'ほっそり 生還') : PRANK_TEXT[Game.cause] || '';
  $('rClock').textContent = clockOf(Game.t).text;
  $('rLeft').textContent = fmt(Game.candy);
  $('rEaten').textContent = fmt(Game.eaten);
  $('rPicked').textContent = fmt(Game.picked);
  $('rStolen').textContent = fmt(Game.stolen);
  const best = loadBest();
  const isBest = Game.t > best + 0.01;
  if (isBest) saveBest(Game.t);
  $('rBest').textContent = isBest && best > 0 ? 'ベスト こうしん！' : best > 0 ? 'ベスト ' + clockOf(Math.max(best, Game.t)).text : '';
  const el = $('result');
  el.classList.add('show', 'wait');   // 指が離れる前にボタンを押してしまわないように、少しの間は触れない
  setTimeout(() => el.classList.remove('wait'), 700);
}

function reactToEvents() {
  for (const e of Game.events) {
    if (e.type === 'start') {
      $('title').classList.add('hide');
    } else if (e.type === 'pick') {
      Snd.pick(e.chain);
      const py = CFG.childY - (e.y - Game.dist);
      burst(e.x, py, '#ffe27a', 5, 22, 0.45);
      addPopup(e.chain >= 3 ? e.chain + 'れんぞく！' : '+1', e.x, py - 4, e.chain >= 3 ? 5.5 : 5, e.chain >= 5 ? '#ff9ad6' : '#ffd23f', 0.6);
    } else if (e.type === 'eat') {
      Snd.eat(Game.candy <= 3 && Game.mode === 'play');
      munchT = 0.16;
    } else if (e.type === 'hit') {
      shakeT = 0.2;
      if (e.k === 'pumpkin') { Snd.hitPumpkin(); addPopup('つまずいた！', Game.x, CFG.childY - 22, 6, '#ffb347', 0.9); }
      else if (e.k === 'ghost') { Snd.hitGhost(); addPopup('「ちょうだい！」', Game.x, CFG.childY - 22, 6, '#e8e0ff', 0.9); }
      else { Snd.hitWitch(); addPopup('さらわれた！', Game.x, CFG.childY - 22, 6, '#d6a6ff', 0.9); }
      burst(Game.x, CFG.childY, '#ff6b6b', 8, 34, 0.5);
      addPopup('-' + e.n, Game.x, CFG.childY - 16, 9, '#ff6b6b', 0.9);
    } else if (e.type === 'house') {
      Snd.house();
      const py = CFG.childY - (e.y - Game.dist);
      burst(e.x < 50 ? 14 : 86, py + 4, '#ffd23f', 16, 40, 0.8);
      addPopup('どうぞ！ +' + e.n, e.x < 50 ? 34 : 66, py - 6, 7, '#ffcf5a', 1.1);
    } else if (e.type === 'witch') {
      Snd.witch();
    } else if (e.type === 'end') {
      if (e.result === 'win') { Snd.dawn(); addPopup('朝に なった！', 50, 70, 11, '#fff6c8', 2.4); }
      else { Snd.prank(); addPopup(PRANK_POP[e.cause] || 'イタズラ！', 50, 100, 10, '#ff9a3d', 1.8); }
    }
  }
  Game.events.length = 0;
}

function frame(ts) {
  const dt = last ? Math.min((ts - last) / 1000, 0.1) : 0;
  last = ts; nowT += dt;
  Game.step(dt);
  reactToEvents();
  if (Game.mode === 'over' && !shownResult) showResult();
  updateVisual(dt);
  render();
  requestAnimationFrame(frame);
}

// ===== 共有（戦利品の袋のカード）=====
function shareText() {
  const win = Game.result === 'win';
  const tag = ' #お菓子を食べ続けないと死ぬゲーム';
  if (win) return 'お菓子を食べ続けないと死ぬゲームで、朝まで生き延びた！ 食べたお菓子は ' + fmt(Game.eaten) + ' 個、のこり ' + fmt(Game.candy) + ' 個。' + tag;
  return 'お菓子を食べ続けないと死ぬゲームで、' + clockOf(Game.t).text + ' に力尽きた…（' + (PRANK_TEXT[Game.cause] || 'イタズラされた') + '）' + tag;
}
function shareUrl() {
  const web = /^https?:/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)/.test(location.host);
  return web ? location.origin + location.pathname : CFG.shareUrl;
}
function makeShareImage() {
  return new Promise(resolve => {
    const Wd = 1080, Ht = 1350, win = Game.result === 'win';
    const cc = document.createElement('canvas');
    cc.width = Wd; cc.height = Ht;
    const c = cc.getContext('2d');
    const bg = c.createLinearGradient(0, 0, 0, Ht);
    bg.addColorStop(0, '#1a1236'); bg.addColorStop(1, win ? '#7a4a6b' : '#3a2060');
    c.fillStyle = bg; c.fillRect(0, 0, Wd, Ht);
    c.fillStyle = '#fff';
    for (let i = 0; i < 50; i++) { c.globalAlpha = 0.3 + hash(i, 5) * 0.5; c.fillRect(hash(i, 1) * Wd, hash(i, 2) * 500, 5, 5); }
    c.globalAlpha = 1;
    c.fillStyle = '#2a1650'; c.strokeStyle = '#ffb347'; c.lineWidth = 10;
    rr(c, 90, 150, Wd - 180, Ht - 330, 50); c.fill(); c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#ffb347'; c.font = 'bold 44px ' + FONT; c.fillText('ハロウィンの夜', Wd / 2, 110);
    c.font = '900 54px ' + FONT; c.fillText('お菓子を食べ続けないと死ぬゲーム', Wd / 2, 250);
    c.fillStyle = '#fff'; c.font = '900 92px ' + FONT; c.fillText(win ? '朝まで 生き延びた！' : 'お菓子が 切れた…', Wd / 2, 400);
    c.fillStyle = '#d9c8ff'; c.font = '52px ' + FONT; c.fillText(win ? (Game.fat() >= 0.75 ? 'ぱんぱんの まんまる！' : '無事に 朝を むかえた') : (PRANK_TEXT[Game.cause] || ''), Wd / 2, 480);
    c.fillStyle = '#ffd23f'; c.font = '900 210px ' + FONT; c.fillText(clockOf(Game.t).text, Wd / 2, 700);
    c.fillStyle = '#d9c8ff'; c.font = '44px ' + FONT; c.fillText('生き延びた時刻', Wd / 2, 760);
    const rows = [['食べた数', fmt(Game.eaten) + ' 個'], ['拾った数', fmt(Game.picked) + ' 個'], ['のこったお菓子', fmt(Game.candy) + ' 個']];
    rows.forEach(([a, b], i) => {
      const y = 880 + i * 100;
      c.strokeStyle = '#ffffff44'; c.lineWidth = 3; c.setLineDash([12, 10]); c.beginPath(); c.moveTo(170, y + 28); c.lineTo(Wd - 170, y + 28); c.stroke(); c.setLineDash([]);
      c.textAlign = 'left'; c.fillStyle = '#d9c8ff'; c.font = '48px ' + FONT; c.fillText(a, 180, y);
      c.textAlign = 'right'; c.fillStyle = '#fff'; c.font = 'bold 56px ' + FONT; c.fillText(b, Wd - 180, y);
    });
    // 戦利品の袋（のこった数だけお菓子が入っている）
    const bx = 130, by = 1215;
    c.fillStyle = '#e8681a'; c.beginPath(); c.arc(bx, by, 52, 0, 6.2832); c.fill();
    c.fillStyle = '#ffd23f'; c.fillRect(bx - 8, by - 72, 16, 22);
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = 'bold 44px ' + FONT; c.fillText(Math.min(Game.candy, 99), bx, by + 15);
    c.textAlign = 'center'; c.fillStyle = '#d9c8ff'; c.font = '38px ' + FONT;
    c.fillText(shareUrl(), Wd / 2 + 60, Ht - 60);
    cc.toBlob(resolve, 'image/png');
  });
}
async function share() {
  const text = shareText(), url = shareUrl();
  try {
    if (navigator.canShare && navigator.share) {
      const blob = await makeShareImage();
      const file = new File([blob], 'okashi-halloween.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) await navigator.share({ text, url, files: [file] });
      else await navigator.share({ text, url });
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url), '_blank', 'noopener');
}
Game.reset();
resize();
bindUI();
requestAnimationFrame(frame);
</script>
